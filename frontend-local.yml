services:
  heron:
    image: node:18-alpine
    working_dir: /app
    ports:
      - "3000:3000"  # Vite 配置端口 3000
    env_file:
      - env/heron-local.env
    volumes:
      - .:/app
      - /app/node_modules
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    restart: no
    environment:
      - NODE_ENV=development
