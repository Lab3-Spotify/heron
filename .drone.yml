kind: pipeline
name: heron-deploy
node:
  repo: Lab3-Spotify-heron
steps:
- image: plugins/docker
  name: build and push docker image
  settings:
    password:
      from_secret: DOCKER_PASSWORD_pony
    repo: popopopony/heron
    tags:
    - latest
    - ${DRONE_COMMIT_SHA}
    username:
      from_secret: DOCKER_USERNAME_pony
    build_args:
    - WALRUS_API_BASE_URL=https://lab3-walrus.ddns.net
    - ENV=staging
    - APP_TITLE=Heron
- commands:
  - kubectl set image deployment/heron heron=popopopony/heron:${DRONE_COMMIT_SHA} --namespace=heron || exit 1
  - kubectl rollout status deployment/heron --namespace=heron || exit 1
  - echo Deployment success!
  image: sinlead/drone-kubectl
  name: deploy to k8s
  settings:
    kubernetes_cert:
      from_secret: K8S_CA
    kubernetes_server:
      from_secret: K8S_SERVER
    kubernetes_token:
      from_secret: K8S_TOKEN
    namespace: heron
    startTimeout: 240
trigger:
  branch:
  - master
  event:
  - push
type: kubernetes
