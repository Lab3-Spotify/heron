"kind": "pipeline"
"name": "heron-deploy"
"node":
  "repo": "Lab3-Spotify-heron"
"steps":
- "image": "plugins/docker"
  "name": "build and push docker image"
  "settings":
    "build_args":
    - "WALRUS_API_BASE_URL=https://walrus.lab3.website"
    - "ENV=staging"
    - "APP_TITLE=Heron"
    - "BUILDKIT_INLINE_CACHE=1"
    "buildkit": true
    "cache_from":
    - "lislab3morris/heron:latest"
    "password":
      "from_secret": "docker-password"
    "repo": "lislab3morris/heron"
    "tags":
    - "latest"
    - "${DRONE_COMMIT_SHA}"
    "username":
      "from_secret": "docker-username"
- "commands":
  - "kubectl set image deployment/heron heron=lislab3morris/heron:${DRONE_COMMIT_SHA} --namespace=heron || exit 1"
  - "kubectl rollout status deployment/heron --namespace=heron || exit 1"
  - "echo Deployment success!"
  "image": "bitnami/kubectl"
  "name": "deploy to k8s"
"trigger":
  "branch":
  - "master"
  "event":
  - "push"
"type": "kubernetes"
---
"get":
  "name": "value"
  "path": "docker-username"
"kind": "secret"
"name": "docker-username"
---
"get":
  "name": "value"
  "path": "docker-password"
"kind": "secret"
"name": "docker-password"
